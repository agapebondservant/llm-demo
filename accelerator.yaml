accelerator:
  displayName: LLM Finetuning
  description: Template for finetuning an LLM using Pytorch, Huggingface Transformers, MLflow, Argo Workflows and Deepeval
  iconUrl: https://cdn-icons-png.flaticon.com/512/3696/3696693.png
  tags:
    - "ML"
    - "AI"
    - "genai"
    - "generativeai"
    - "llm"
    - "artificialintelligence"
    - "llmops"
    - "machinelearning"
    - "datascience"
    - "MLOps"
    - "python"
    - "mlflow"
    - "sample"
    - "pipeline"
  options:
    - name: targetLlm
      inputType: select
      label: "Target LLM"
      choices:
        - text: "--Select an LLM--"
          value: "none"
        - value: pythia
          text: "tanzuml/pythia-410m"
        - value: mistral
          text: "tanzuml/Mistral-7B-v0.1"
        - value: microsoft
          text: "tanzuml/Phi-3-mini-4k-instruct"
      defaultValue: "none"
      required: true
    - name: targetLlmVersion
      inputType: text
      label: "Target LLM Version"
      defaultValue: "1.0"
      required: true
    - name: teacherLlm
      inputType: select
      label: "Teacher LLM (for knowledge distillation tasks)"
      choices:
        - text: "--Select an LLM--"
          value: "none"
        - value: pythia
          text: "tanzuml/pythia-410m"
        - value: mistral
          text: "tanzuml/Mistral-7B-v0.1"
        - value: microsoft
          text: "tanzuml/Phi-3-mini-4k-instruct"
      defaultValue: "none"
    - name: teacherLlmVersion
      inputType: text
      label: "Teacher LLM Version (for knowledge distillation tasks)"
      defaultValue: "1.0"
    - name: evaluationLlm
      inputType: select
      label: "Evaluation LLM (for LLM-as-judge tasks)"
      choices:
        - text: "--Select an LLM--"
          value: "none"
        - value: pythia
          text: "tanzuml/pythia-410m"
        - value: mistral
          text: "tanzuml/Mistral-7B-v0.1"
        - value: microsoft
          text: "tanzuml/Phi-3-mini-4k-instruct"
      defaultValue: "none"
    - name: evaluationLlmVersion
      inputType: text
      label: "Evaluation LLM Version (for LLM-as-judge tasks)"
      defaultValue: "1.0"
    - name: dataset
      inputType: text
      display: true
      label: 'Dataset'
      required: true
    - name: mlopsPlatformEndpoint
      inputType: text
      display: true
      label: 'MLOps Platform Endpoint (can point to VMware Private AI Foundation, MLflow, Weights & Biases, Kubeflow, etc)'
      defaultValue: ""
    - name: trainingComputeEndpoint
      inputType: text
      display: true
      label: 'Training Compute Endpoint (can point to VMware Private AI Foundation, Ray, Spark, etc)'
      defaultValue: ""
    - name: mlGovernanceEndpoint
      inputType: text
      display: true
      label: 'ML / Data Governance Platform Endpoint'
      defaultValue: ""
    - name: mlObservabilityEndpoint
      inputType: text
      display: true
      label: 'ML Observability Platform Endpoint'
      defaultValue: ""
    - name: llmGatewayEndpoint
      inputType: text
      label: "LLM Gateway Endpoint"
      defaultValue: ""
    - name: llmGatewayToken
      inputType: select
      label: "LLM Gateway Token"
      choices:
        - value: "none"
          text: "--Select a token--"
        - value: "hub-token"
          text: Hub Token
      defaultValue: "none"

engine:
  type: Merge
  sources:
    - type: Chain
      transformations:
        - type: Include
          patterns: [ '**/**' ]
        - type: Exclude
          patterns: [ 'README.md', 'slack-data/**', 'slack-tmp/**', 'driver/**', 'docs/**', 'resources/huggingface/**', 'resources/scripts/**', 'resources/tapworkloads/**', 'resources/argo/**', 'resources/datahub/**', 'resources/db/**', 'resources/gpu/**' ]
        - type: ReplaceText
          substitutions:
            - text: REPLACE_TARGET_LLM
              with: "#targetLlm"
            - text: REPLACE_TARGET_LLM_VERSION
              with: "#targetLlmVersion"
            - text: REPLACE_TEACHER_LLM
              with: "#teacherLlm"
            - text: REPLACE_TEACHER_LLM_VERSION
              with: "#teacherLlmVersion"
            - text: REPLACE_EVALUATION_LLM
              with: "#evaluationLlm"
            - text: REPLACE_EVALUATION_LLM_VERSION
              with: "#evaluationLlmVersion"
            - text: REPLACE_DATASET
              with: "#dataset"
            - text: REPLACE_MLOPS_PLATFORM_ENDPOINT
              with: "#mlopsPlatformEndpoint"
            - text: REPLACE_TRAINING_COMPUTE_ENDPOINT
              with: "#trainingComputeEndpoint"
            - text: REPLACE_ML_GOVERNANCE_ENDPOINT
              with: "#mlGovernanceEndpoint"
            - text: REPLACE_ML_OBSERVABILITY_ENDPOINT
              with: "#mlObservabilityEndpoint"
            - text: REPLACE_LLM_GATEWAY_TOKEN
              with: "#llmGatewayToken"
        - type: RewritePath
          regex: 'MLProject\.template'
          rewriteTo: MLProject
        - type: UniquePath
          strategy: UseLast
