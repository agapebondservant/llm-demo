accelerator:
  displayName: LLM Finetuning
  description: Template for finetuning an LLM using Pytorch, Huggingface Transformers, MLflow, Argo Workflows and Deepeval
  iconUrl: https://cdn-icons-png.flaticon.com/512/3696/3696693.png
  tags:
    - "ML"
    - "AI"
    - "genai"
    - "generativeai"
    - "llm"
    - "artificialintelligence"
    - "llmops"
    - "machinelearning"
    - "datascience"
    - "MLOps"
    - "python"
    - "mlflow"
    - "sample"
    - "pipeline"
  options:
    - name: targetLlm
      inputType: select
      label: "Target LLM"
      choices:
        - text: "--Select an LLM--"
          value: "none"
        - value: pythia
          text: "EleutherAI/pythia-410m"
        - value: mistral
          text: "mistralai/Mistral-7B-v0.1"
        - value: microsoft
          text: "microsoft/Phi-3-mini-4k-instruct"
      defaultValue: "none"
      required: true

engine:
  type: Merge
  sources:
    - type: Chain
      transformations:
        - type: Include
          patterns: [ '**/**' ]
        - type: Exclude
          patterns: [ 'slack-data', 'slack-tmp', 'driver', 'docs', 'resources/huggingface', 'resources/scripts', 'resources/tapworkloads', 'resources/argo', 'resources/datahub', 'resources/db', 'resources/gpu' ]
        - type: ReplaceText
          substitutions:
            - text: REPLACE_TARGET_LLM
              with: "#targetLlm"
        - type: RewritePath
          regex: MLProjecttemplate
          rewriteTo: MLProject
